services:
  marketing-service:
    build:
      context: .
    container_name: marketing-service
    # Wichtig: Kein "ports"-Mapping nach außen! Der Service ist nur intern erreichbar
    expose:
      - "8080"

  nginx:
    image: nginx:alpine
    container_name: reverse-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - marketing-service