events {}
http {
    server {
        listen 80;

        # 1. Regel: Alles was mit /marketing/ beginnt, geht an das Backend (Regel für meine API)
        location /marketing/ {
            proxy_pass http://marketing-service:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        #  2. Regel: Alles andere (z.B. / oder /index.html) geht auch an das Backend (Regel für das Frontend (alles andere)
        #   Spring Boot liefern dann die HTML-Datei aus dem static-Ordner aus
        location / {
            proxy_pass http://marketing-service:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

    }

}