events {}
http {
    server {
        listen 80;

        # Regel für deine API
        location /marketing/ {
            proxy_pass http://marketing-service:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Regel für das Frontend (alles andere)
        location / {
            proxy_pass http://marketing-service:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}